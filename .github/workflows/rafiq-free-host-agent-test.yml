name: RAFIQ isolated free-host agent test
on:
  push:
    branches:
      - staging/rafiq-current-free-host-20261011
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: Install dependencies
        run: bun install
      - name: Run mocked model tests
        run: bun test src/agent-free-test.test.ts
      - name: Compile server without starting it
        run: bun build src/index.ts --target=bun --outdir=/tmp/rafig-free-agent-test
      - name: Build minimal Docker image
        run: docker build --tag rafiq-free-agent-test:ci .
      - name: Validate staging-only security gates
        shell: bash
        run: |
          grep -q 'const RAFIQ_STAGING_ONLY = true' src/index.ts
          grep -q 'x-rafiq-staging-token' src/index.ts
          grep -q 'const allowed=' src/index.ts
          grep -q 'RAFIQ_STAGING_ONLY || !telegramConfigured()' src/index.ts
          grep -q 'RAFIQ_STAGING_ONLY || process.env.TELEGRAM_MARKETING_ENABLED' src/index.ts
          grep -q 'RAFIQ_STAGING_ONLY || process.env.TELEGRAM_BROADCAST_ON_START' src/index.ts
