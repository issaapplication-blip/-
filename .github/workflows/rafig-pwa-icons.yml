name: RAFIQ PWA icons

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/assets/rafig-logo.png'
      - '.github/workflows/rafig-pwa-icons.yml'

permissions:
  contents: read

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install ImageMagick
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Verify ImageMagick and source logo
        shell: bash
        run: |
          set -euo pipefail
          command -v convert
          command -v identify
          test -f public/assets/rafig-logo.png

      - name: Generate PWA icons from approved RAFIQ logo
        shell: bash
        run: |
          set -euo pipefail
          test -f public/assets/rafig-logo.png
          convert public/assets/rafig-logo.png -resize 192x192! -strip public/icon-192.png
          convert public/assets/rafig-logo.png -resize 512x512! -strip public/icon-512.png
          convert public/assets/rafig-logo.png -resize 448x448 -gravity center -background white -extent 512x512 -strip public/icon-maskable-512.png
          convert public/assets/rafig-logo.png -resize 180x180! -strip public/apple-touch-icon.png
          identify public/icon-192.png public/icon-512.png public/icon-maskable-512.png public/apple-touch-icon.png

      - name: Validate generated icon dimensions
        shell: bash
        run: |
          set -euo pipefail
          test "$(identify -format '%wx%h' public/icon-192.png)" = "192x192"
          test "$(identify -format '%wx%h' public/icon-512.png)" = "512x512"
          test "$(identify -format '%wx%h' public/icon-maskable-512.png)" = "512x512"
          test "$(identify -format '%wx%h' public/apple-touch-icon.png)" = "180x180"

      - name: Ensure generated icons match tracked repository assets
        shell: bash
        run: |
          set -Eeuo pipefail
          outputs=(public/icon-192.png public/icon-512.png public/icon-maskable-512.png public/apple-touch-icon.png)
          for output in "${outputs[@]}"; do
            git ls-files --error-unmatch "$output" >/dev/null
          done
          if ! git diff --exit-code -- "${outputs[@]}"; then
            echo "::error::Generated PWA icons differ from tracked assets. Update the icon files in this pull request; this workflow will not commit or push them."
            exit 1
          fi
          if [[ -n "$(git ls-files --others --exclude-standard -- "${outputs[@]}")" ]]; then
            echo "::error::Generated PWA icons are not tracked by Git."
            exit 1
          fi

      - name: Report generated icons
        shell: bash
        run: |
          set -euo pipefail
          echo "PWA icons generated and dimension-checked. This workflow does not commit or push changes." >> "$GITHUB_STEP_SUMMARY"

# PWA icon generation uses the hosted Ubuntu runner ImageMagick package.
