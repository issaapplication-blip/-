name: RAFIQ deployment health check

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check configured deployment health URL
        shell: bash
        env:
          HEALTH_URL: ${{ vars.RAFIQ_HEALTH_URL }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${HEALTH_URL//[[:space:]]/}" ]]; then
            echo "::notice::Skipped: configure the repository variable RAFIQ_HEALTH_URL with a verified deployed HTTPS health/status URL."
            exit 0
          fi
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          raw = os.environ["HEALTH_URL"].strip()
          u = urlsplit(raw)
          if u.scheme != "https" or not u.netloc or u.username or u.password or u.fragment:
              raise SystemExit("RAFIQ_HEALTH_URL must be a valid HTTPS URL without embedded credentials or a fragment")
          if "onrender.com" in u.netloc.lower():
              raise SystemExit("Render is retired for RAFIQ; refusing to check a Render URL")
          PY
          status=$(curl --silent --show-error --output /tmp/rafiq-health-body --write-out '%{http_code}' --max-time 20 "$HEALTH_URL")
          echo "Health HTTP status: $status"
          if [[ "$status" != "200" ]]; then
            echo "::error::Configured RAFIQ health endpoint did not return HTTP 200."
            cat /tmp/rafiq-health-body || true
            exit 1
          fi
          echo "Configured RAFIQ health endpoint responded with HTTP 200."
