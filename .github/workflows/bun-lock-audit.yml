name: RAFIQ Bun lock audit

on:
  push:
    branches:
      - fix/bun-lock-audit
    paths:
      - '.github/workflows/bun-lock-audit.yml'
      - 'bun.lock'
      - 'package.json'
      - 'Dockerfile'
      - 'src/**'
      - 'tests/**'
      - 'ops/**'
      - 'wrangler.toml'
      - 'public/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rafiq-bun-lock-audit
  cancel-in-progress: false

jobs:
  regenerate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bun-lock-audit
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Record baseline
        id: baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          bun --version
          sha256sum bun.lock | tee /tmp/bun-lock-before.sha256
          cp bun.lock /tmp/bun.lock.before
          if test -f bun.lockb; then
            echo "Unexpected bun.lockb exists; refusing to leave ambiguous lockfiles."
            cp bun.lockb /tmp/bun.lockb.backup
            exit 1
          fi
          grep -rn "bun.lock" .github/workflows/ Dockerfile || true
          python3 - <<'PY'
          import re
          s=open("bun.lock", encoding="utf-8").read()
          print("Baseline package entries:", len(re.findall(r'^    ".*": \[', s, re.M)))
          PY

      - name: Regenerate lock with Bun 1.3.10
        run: bun install --lockfile-only

      - name: Verify frozen lockfile dry run
        run: bun install --frozen-lockfile --dry-run

      - name: Verify frozen install
        run: bun install --frozen-lockfile

      - name: Capture dependency inventory
        run: bun pm ls --all > /tmp/deps-after.txt

      - name: Run isolated tests
        run: |
          set -Eeuo pipefail
          bun test tests/functions
          bun test src

      - name: Validate scripts and Cloudflare bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          if test -f ops/backup.sh && test -f ops/verify.sh; then
            bash -n ops/backup.sh ops/verify.sh
          fi
          if test -f ops/build-cloudflare-pages.sh; then
            RAFIQ_PUBLIC_BASE_URL=https://rafiq-ci.pages.dev bash ops/build-cloudflare-pages.sh
            test -f dist/index.html
            test -f dist/admin.html
            test -f dist/_routes.json
            test ! -e dist/auto-reply.mjs
            if grep -RniE 'onrender\.com|rafiq-o6qd' dist/ public/; then
              echo "Render reference found in built/public assets; stop for manual review."
              exit 1
            fi
          fi

      - name: Enforce frozen dependency install in Dockerfile
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Dockerfile")
          s=p.read_text()
          if "COPY bun.lock ./" not in s:
              s=s.replace("COPY package.json ./", "COPY package.json bun.lock ./")
          s=s.replace("RUN bun install --production", "RUN bun install --frozen-lockfile --production")
          if "RUN bun install --frozen-lockfile --production" not in s:
              raise SystemExit("Could not safely switch Dockerfile to frozen lockfile install.")
          p.write_text(s)
          PY
          docker build --tag rafiq-backend:lock-audit .

      - name: Docker health smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          docker rm -f rafiq-backend-lock-audit >/dev/null 2>&1 || true
          docker run -d --name rafiq-backend-lock-audit -p 127.0.0.1:17861:7860 \
            -e PORT=7860 -e HOST=0.0.0.0 -e NODE_ENV=production \
            -e WHATSAPP_SENDING_ENABLED=false -e RAFIQ_WHATSAPP_AUTO_REPLY=false \
            -e RAFIQ_WHATSAPP_TO_TELEGRAM_FORWARDING=false \
            -e RAFIQ_TELEGRAM_AUTO_REGISTER_WEBHOOK=false -e TELEGRAM_MARKETING_ENABLED=false \
            -e TELEGRAM_BROADCAST_ON_START=false -e KAPSO_ENABLED=false rafiq-backend:lock-audit
          cleanup() {
            echo "::group::Docker logs"
            docker logs rafiq-backend-lock-audit 2>&1 || true
            echo "::endgroup::"
            echo "::group::Docker inspect"
            docker inspect rafiq-backend-lock-audit --format '{{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' 2>&1 || true
            echo "::endgroup::"
            docker stop rafiq-backend-lock-audit >/dev/null 2>&1 || true
            docker rm -f rafiq-backend-lock-audit >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:17861/health > /tmp/rafiq-health.json; then ready=1; break; fi
            if ! docker inspect --format '{{.State.Running}}' rafiq-backend-lock-audit 2>/dev/null | grep -qx true; then exit 1; fi
            sleep 2
          done
          test "$ready" -eq 1
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/rafiq-health.json', encoding='utf-8'))
          assert set(d.keys()) == {'status','service','timestamp'}, d
          assert d['status']=='ok' and d['service']=='rafiq-backend', d
          assert isinstance(d['timestamp'], str), d
          print('Health contract passed:', d)
          PY

      - name: Report lock changes and commit verified result
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "### Bun lock audit" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bun: $(bun --version)" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA256 before: $(cut -d' ' -f1 /tmp/bun-lock-before.sha256)" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA256 after: $(sha256sum bun.lock | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import re, subprocess
          from pathlib import Path
          old=Path('/tmp/bun.lock.before').read_text()
          new=Path('bun.lock').read_text()
          pat=re.compile(r'^    "([^"]+)": \["([^"]+)"', re.M)
          a=dict(pat.findall(old)); b=dict(pat.findall(new))
          print(f"- Package entries before/after: {len(a)} / {len(b)}")
          changes=[]
          for name in sorted(set(a)|set(b)):
              if a.get(name)!=b.get(name):
                  changes.append((name,a.get(name,'<added>'),b.get(name,'<removed>')))
          print("- Version/entry changes (first 10):")
          for name,x,y in changes[:10]:
              print(f"  - {name}: {x} -> {y}")
          print(f"- Total changed entries: {len(changes)}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- bun.lock Dockerfile; then
            git add bun.lock Dockerfile
            git commit -m "fix: regenerate bun lock and enforce frozen Docker install"
            git push origin fix/bun-lock-audit
          else
            echo "No lockfile or Dockerfile changes to commit."
          fi
