name: RAFIQ edge function unit tests

on:
  pull_request:
    paths:
      - 'supabase/functions/rafiq-agent/**'
      - 'supabase/functions/public-intake/**'
      - 'supabase/functions/meta-whatsapp-webhook/**'
      - 'public/**'
      - 'supabase/functions/public-application-intake/**'
      - 'supabase/functions/public-application-upload/**'
      - 'tests/functions/**'
      - 'src/index.ts'
      - 'src/agent.ts'
      - 'src/rafiq-config.ts'
      - 'src/rafiq-service-knowledge.ts'
      - 'docs/RAFIQ_ENVIRONMENT_TEMPLATE.md'
      - 'Dockerfile'
      - 'package.json'
      - 'bun.lock'
      - 'src/telegram-update-dedup.ts'
      - 'src/telegram-update-dedup.test.ts'
      - 'src/http-cache-policy.ts'
      - 'src/http-cache-policy.test.ts'
      - 'ops/**'
      - 'functions/**'
      - 'public/admin.js'
      - 'wrangler.toml'
      - 'supabase/functions/telegram-webhook/**'
      - 'supabase/migrations/**'
      - 'supabase/rollback/**'
      - 'docs/recovery/**'
      - 'ops/**'
      - '.github/workflows/rafiq-edge-function-tests.yml'
      - '.github/workflows/keep-alive.yml'
      - 'supabase/functions/telegram-webhook/**'
      - 'supabase/migrations/**'
      - 'supabase/rollback/**'
      - 'docs/recovery/**'
      - 'functions/**'
      - 'public/admin.js'
      - 'wrangler.toml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/rafiq-agent/**'
      - 'supabase/functions/public-application-intake/**'
      - 'supabase/functions/public-application-upload/**'
      - 'tests/functions/**'
      - 'src/index.ts'
      - 'src/agent.ts'
      - 'src/rafiq-config.ts'
      - 'src/rafiq-service-knowledge.ts'
      - 'docs/RAFIQ_ENVIRONMENT_TEMPLATE.md'
      - 'src/telegram-update-dedup.ts'
      - 'src/telegram-update-dedup.test.ts'
      - 'src/http-cache-policy.ts'
      - 'src/http-cache-policy.test.ts'
      - 'Dockerfile'
      - 'public/index.html'
      - 'public/app.html'
      - 'public/manifest.json'
      - 'public/sw.js'
      - 'package.json'
      - 'bun.lock'
      - '.dockerignore'
      - '.github/workflows/rafiq-edge-function-tests.yml'

permissions:
  contents: read

jobs:
  edge-function-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check changed Supabase Edge Functions with Deno
        run: deno check supabase/functions/public-intake/index.ts supabase/functions/meta-whatsapp-webhook/index.ts
      - name: Build and smoke-test Hugging Face Docker runtime
        id: docker-smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build --tag rafiq-backend:ci .
          # Keep the container after exit so diagnostics can be collected before removal.
          docker rm -f rafiq-backend-ci >/dev/null 2>&1 || true
          docker run --detach --name rafiq-backend-ci --publish 127.0.0.1:17860:7860 \
            --env PORT=7860 --env HOST=0.0.0.0 --env NODE_ENV=production \
            --env WHATSAPP_SENDING_ENABLED=false \
            --env RAFIQ_WHATSAPP_AUTO_REPLY=false \
            --env RAFIQ_WHATSAPP_TO_TELEGRAM_FORWARDING=false \
            --env RAFIQ_TELEGRAM_AUTO_REGISTER_WEBHOOK=false \
            --env TELEGRAM_MARKETING_ENABLED=false \
            --env TELEGRAM_BROADCAST_ON_START=false \
            --env KAPSO_ENABLED=false \
            rafiq-backend:ci
          cleanup() {
            echo "::group::RAFIQ container logs"
            docker logs rafiq-backend-ci 2>&1 || true
            echo "::endgroup::"
            echo "::group::RAFIQ container inspect"
            docker inspect rafiq-backend-ci --format '{{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' 2>&1 || true
            echo "::endgroup::"
            docker stop rafiq-backend-ci >/dev/null 2>&1 || true
            docker rm -f rafiq-backend-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:17860/health > /tmp/rafiq-health.json; then
              ready=1
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' rafiq-backend-ci 2>/dev/null | grep -qx true; then
              echo "Container exited before becoming ready."
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Health check timed out after 60 seconds."
            exit 1
          fi
          python3 - <<'PY'
          import json
          with open("/tmp/rafiq-health.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data.get("status") == "ok", data
          assert data.get("service") == "rafiq-backend", data
          assert isinstance(data.get("timestamp"), str), data
          print("Docker health smoke test passed")
          PY
      - uses: oven-sh/setup-bun@v2
        if: always()
        with:
          bun-version: 1.3.10
      - name: Validate Bun lockfile reproducibility
        if: always()
        run: bun install --frozen-lockfile
      - name: Validate backup script syntax
        if: always()
        run: bash -n ops/backup.sh ops/verify.sh
      - name: Validate Cloudflare Pages bundle
        if: always()
        run: |
          RAFIQ_PUBLIC_BASE_URL=https://rafiq-ci.pages.dev bash ops/build-cloudflare-pages.sh
          test -f dist/index.html
          test -f dist/admin.html
          test -f dist/_routes.json
          test ! -e dist/auto-reply.mjs
          if grep -RniE 'onrender\.com|rafiq-o6qd' dist/; then
            echo "❌ Render reference found in BUILT assets (dist/). Stop for manual review."
            exit 1
          fi
          echo "✅ No Render references in built assets."
      - name: Run mocked, offline Supabase Edge Function tests
        if: always()
        run: |
          bun test tests/functions
          bun test src
