name: RAFIQ edge function unit tests

on:
  pull_request:
    paths:
      - 'supabase/functions/rafiq-agent/**'
      - 'tests/functions/**'
      - 'src/index.ts'
      - 'src/telegram-update-dedup.ts'
      - 'src/telegram-update-dedup.test.ts'
      - 'src/http-cache-policy.ts'
      - 'src/http-cache-policy.test.ts'
      - 'ops/**'
      - '.github/workflows/rafiq-edge-function-tests.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/rafiq-agent/**'
      - 'tests/functions/**'
      - 'src/index.ts'
      - 'src/telegram-update-dedup.ts'
      - 'src/telegram-update-dedup.test.ts'
      - 'src/http-cache-policy.ts'
      - 'src/http-cache-policy.test.ts'

permissions:
  contents: read

jobs:
  edge-function-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Validate backup script syntax
        run: bash -n ops/backup.sh ops/verify.sh
      - name: Run mocked, offline Supabase Edge Function tests
        run: |
          bun test tests/functions
          bun test src
