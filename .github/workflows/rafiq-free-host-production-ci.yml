name: RAFIQ full-app free-host build checks
on:
  push:
    branches:
      - deploy/rafiq-free-host-20261011
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: Install dependencies
        run: bun install
      - name: Test local Ollama provider
        run: bun test src/agent-ollama.test.ts
      - name: Test Gemini privacy redaction
        run: bun test src/agent-gemini-privacy.test.ts
      - name: Compile full application without starting it
        run: bun build src/index.ts --target=bun --outdir=/tmp/rafig-production-free-host
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml config -q
      - name: Build full application Docker image
        run: docker build --tag rafiq-production-free-host:ci .
      - name: Verify private-model and conservative messaging defaults
        shell: bash
        run: |
          grep -q 'ENV RAFIQ_AGENT_PROVIDER=ollama' Dockerfile
          grep -q 'ENV RAFIQ_OLLAMA_URL=http://ollama:11434' Dockerfile
          grep -q 'ENV KAPSO_ENABLED=false' Dockerfile
          grep -q 'ENV WHATSAPP_SENDING_ENABLED=false' Dockerfile
          grep -q 'ENV RAFIQ_WHATSAPP_AUTO_REPLY=false' Dockerfile
          grep -q 'ENV RAFIQ_WHATSAPP_TO_TELEGRAM_FORWARDING=true' Dockerfile
          grep -q 'ENV RAFIQ_TELEGRAM_WEBHOOK_AUTOCONFIG=false' Dockerfile
          grep -q 'forwarded_to_telegram_manager' src/index.ts
          grep -q 'safeInput' src/agent.ts
          grep -q 'if (!expected) return false' src/telegram.ts
          grep -q 'RAFIQ_TELEGRAM_WEBHOOK_AUTOCONFIG !== "true"' src/index.ts
          ! grep -q 'ports:' docker-compose.yml
