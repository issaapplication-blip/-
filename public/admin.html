<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087f58">
<link rel="icon" href="./assets/rafig-logo.png?v=20260928" type="image/png">
<title>RAFIQ | لوحة المدير</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f8f6;color:#17372d;line-height:1.6}
main{max-width:1200px;margin:auto;padding:12px}.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 22px rgba(0,0,0,.06)}
h1,h2,h3{color:#087f58}.brand{display:block;width:min(250px,70vw);margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.item{border:1px solid #dce8e2;border-radius:14px;padding:14px}.btn{border:0;border-radius:10px;padding:10px 15px;background:#087f58;color:#fff;font-weight:bold;cursor:pointer}.danger{background:#a52b2b}.alt{background:#eaf2ef;color:#17372d}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:13px;color:#66756f}.hidden{display:none!important}.ok,.err,.notice{padding:12px;border-radius:10px;margin:10px 0}.ok{background:#edf8f2}.err{background:#fff0f0;color:#8b1e1e}.notice{background:#fff8e8}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.status{font-weight:bold}.doc{background:#f7faf8;padding:10px;border-radius:9px;margin:7px 0}
input,textarea{width:100%;padding:10px;border:1px solid #cbdad3;border-radius:9px;font:inherit}
</style>
<style>.logo-fallback{display:inline-block;font-weight:900;color:#087f58;font-size:20px;letter-spacing:.5px}</style>
<style>body{overflow-x:hidden}nav.card{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:12px}nav.card a.btn{flex:0 0 auto;white-space:nowrap;font-size:14px;padding:10px 14px}.logo{display:block;width:min(150px,42vw)!important;height:auto!important;margin:0 auto 10px!important;background:#fff;border-radius:14px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.07)}.brand-logo{display:block;width:min(190px,55vw)!important;height:auto!important;margin:0 auto 10px!important;background:#fff;border-radius:14px;padding:6px}h1{font-size:24px}article.card h1,section.card h1{font-size:22px}@media(max-width:520px){nav.card{gap:6px}nav.card a.btn{font-size:13px;padding:9px 11px;flex:1 1 calc(50% - 3px);text-align:center}}</style>
<style>.item h2 a,.item h3 a{display:inline-block;background:#087f58;color:#fff!important;text-decoration:none;border-radius:10px;padding:9px 14px;margin:4px 0;font-size:14px;font-weight:800;box-shadow:0 3px 10px rgba(8,127,88,.22)}.item h2 a:hover,.item h3 a:hover{background:#0b9b6b}</style>
<meta name="description" content="لوحة إدارة RAFIQ.">
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://rafiq-o6qd.onrender.com/admin.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="RAFIQ | رفيق">
<meta property="og:locale" content="ar_LB">
<meta property="og:title" content="إدارة المنصة | RAFIQ | رفيق">
<meta property="og:description" content="لوحة إدارة RAFIQ.">
<meta property="og:url" content="https://rafiq-o6qd.onrender.com/admin.html">
<meta property="og:image" content="https://rafiq-o6qd.onrender.com/assets/rafig-logo.png">
<meta name="twitter:card" content="summary">
</head>
<body>
<main>
<section class="card" style="text-align:center">
<img class="brand" src="./assets/rafig-logo.png?v=20260928" alt="RAFIQ - رفيق">
<h1>لوحة مدير RAFIQ</h1>
<p><strong>المراجعة والموافقة على الطلبات والوثائق</strong></p>
<p class="small">هذه الصفحة لا تمنح صلاحيات بحد ذاتها. الوصول إلى البيانات والقرارات محمي داخل Supabase بدور Admin نشط.</p>
</section>

<section class="card" id="auth">
<h2>🔐 دخول المدير</h2>
<label>البريد الإلكتروني<input id="email" type="email" autocomplete="username"></label>
<label>كلمة المرور<input id="password" type="password" autocomplete="current-password"></label>
<div class="actions"><button class="btn" id="login">دخول</button><a class="btn alt" href="./app.html">العودة إلى التسجيل</a></div>
<div id="authMsg"></div>
</section>

<section class="card hidden" id="dashboard">
<div class="row"><div><h2>📋 الطلبات والملفات</h2><p class="small" id="who"></p></div><button class="btn alt" id="logout">تسجيل الخروج</button></div>
<div id="dashMsg"></div>
<div class="actions"><button class="btn" id="refresh">🔄 تحديث</button><button class="btn alt" id="pendingOnly">الطلبات المعلقة</button></div>
<div id="applications" class="grid"></div>
<h2>📎 الوثائق الخاصة</h2>
<div id="documents" class="grid"></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://qmuxaehrahfsnabyjens.supabase.co',KEY='sb_publishable_AYoQSOTwTF1w3RT6CglKmA_WVcYUVlD';
const db=supabase.createClient(SUPABASE_URL,KEY),$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(t,ok=false){$('dashMsg').innerHTML='<div class="'+(ok?'ok':'err')+'">'+esc(t)+'</div>'}
async function requireAdmin(){
 const {data:{user}}=await db.auth.getUser(); if(!user){$('authMsg').innerHTML='<div class="err">يرجى تسجيل الدخول بحساب المدير.</div>';return false;}
 const {data:p,error}=await db.from('profiles').select('email,role,status').eq('id',user.id).single();
 if(error){$('authMsg').innerHTML='<div class="err">تعذر التحقق من صلاحيات الحساب: '+esc(error.message||'خطأ في الصلاحيات')+'</div>';return false;} if(!p||p.role!=='admin'||p.status!=='active'){await db.auth.signOut();$('authMsg').innerHTML='<div class="err">هذا الحساب ليس حساب مدير نشطًا.</div>';return false;}
 $('who').textContent='المدير: '+(p.email||user.email);return true;
}
async function load(){
 if(!await requireAdmin()){ $('dashboard').classList.add('hidden');$('auth').classList.remove('hidden'); return; }
 $('auth').classList.add('hidden');$('dashboard').classList.remove('hidden');
 const {data:apps,error:ae}=await db.from('applications').select('id,user_id,application_type,status,notes,created_at,updated_at').order('created_at',{ascending:false}).limit(100);
 if(ae){msg('تعذر تحميل الطلبات: '+ae.message);return}
 $('applications').innerHTML=apps.map(a=>'<article class="item"><div class="row"><strong>'+esc(a.application_type)+'</strong><span class="status">'+esc(a.status)+'</span></div><p class="small">ID: '+esc(a.id)+'<br>المستخدم: '+esc(a.user_id)+'<br>'+esc(a.created_at)+'</p><p>'+esc(a.notes||'لا توجد ملاحظات')+'</p><div class="actions"><button class="btn" onclick="reviewApp(\''+a.id+'\',\'approved\')">✓ موافقة</button><button class="btn danger" onclick="reviewApp(\''+a.id+'\',\'rejected\')">✕ رفض</button><button class="btn alt" onclick="reviewApp(\''+a.id+'\',\'review\')">مراجعة</button></div></article>').join('')||'<p>لا توجد طلبات.</p>';
 const {data:docs,error:de}=await db.from('documents').select('id,user_id,document_type,file_name,mime_type,file_size,verification_status,storage_path,created_at').order('created_at',{ascending:false}).limit(100);
 if(de){$('documents').innerHTML='<div class="err">تعذر تحميل الوثائق: '+esc(de.message)+'</div>';return}
 $('documents').innerHTML=docs.map(d=>'<article class="item"><strong>'+esc(d.file_name)+'</strong><p class="small">'+esc(d.document_type)+' · '+esc(d.verification_status)+'<br>المستخدم: '+esc(d.user_id)+'<br>'+esc(d.storage_path)+'</p><div class="actions"><button class="btn" onclick="reviewDoc(\''+d.id+'\',\'approved\')">✓ اعتماد</button><button class="btn danger" onclick="reviewDoc(\''+d.id+'\',\'rejected\')">✕ رفض</button><button class="btn alt" onclick="openDoc(\''+encodeURIComponent(d.storage_path)+'\')">فتح الوثيقة</button></div></article>').join('')||'<p>لا توجد وثائق.</p>';
}
window.reviewApp=async(id,status)=>{const notes=prompt(status==='rejected'?'سبب الرفض (اختياري):':status==='approved'?'ملاحظات الموافقة (اختياري):':'ملاحظات المدير (اختياري):');const {error}=await db.rpc('admin_review_application',{p_application_id:id,p_status:status,p_notes:notes||null});if(error)return msg('تعذر تحديث الطلب: '+error.message);msg('تم تحديث الطلب بنجاح.',true);load()};
window.reviewDoc=async(id,status)=>{const {error}=await db.rpc('admin_review_document',{p_document_id:id,p_status:status});if(error)return msg('تعذر تحديث الوثيقة: '+error.message);msg('تم تحديث الوثيقة بنجاح.',true);load()};
window.openDoc=async encoded=>{const path=decodeURIComponent(encoded);const {data,error}=await db.storage.from('private_documents').createSignedUrl(path,300);if(error)return msg('تعذر فتح الوثيقة. تأكد من وجود مستند صحيح وصلاحيات المدير.');window.open(data.signedUrl,'_blank','noopener,noreferrer')};
$('login').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('authMsg').innerHTML='<div class="err">تعذر تسجيل الدخول: '+esc(error.message||'بيانات الدخول غير صحيحة')+'</div>';return}load()};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
$('refresh').onclick=load;$('pendingOnly').onclick=async()=>{await load();document.querySelectorAll('#applications .item').forEach((el)=>{if(!el.querySelector('.status').textContent.includes('pending'))el.style.display='none'})};
load();
</script>
<script>
/* RAFIQ logo guard: if the SVG fails to load, show a text wordmark instead. */
document.addEventListener("DOMContentLoaded",function(){
  document.querySelectorAll("img[src*='rafig-logo.png']").forEach(function(img){
    img.addEventListener("error",function(){
      var s=document.createElement("span");
      s.className="logo-fallback";
      s.textContent="RAFIQ | رفيق";
      if(getComputedStyle(img).display==="none"||img.naturalWidth===0){
        img.replaceWith(s);
      }
    });
  });
});
</script>
</body>
</html>
