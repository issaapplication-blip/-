<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087f58"><link rel="icon" href="/assets/rafig-logo.png?v=20260928"><title>RAFIQ | مساعد رفيق</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f8f5;color:#17372d;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}.wrap{max-width:780px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #dce8e2;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 5px 20px #0000000d}.logo{width:120px;height:120px;object-fit:contain;display:block;margin:auto;border-radius:16px}.chat{height:430px;overflow:auto;border:1px solid #dce8e2;border-radius:14px;padding:12px;background:#fbfdfc}.m{padding:11px 13px;border-radius:14px;margin:8px 0;white-space:pre-wrap;line-height:1.8}.a{background:#edf8f2;margin-left:10%}.u{background:#eaf2ef;margin-right:10%}.composer{display:flex;gap:8px;margin-top:10px}.composer textarea{flex:1;min-height:58px;border:1px solid #cbdad3;border-radius:12px;padding:10px;font:inherit}.btn{border:0;border-radius:11px;padding:11px 16px;background:#087f58;color:#fff;font-weight:800;cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.alt{background:#eaf2ef;color:#17372d}.status{font-size:13px;color:#66756f;text-align:center}.err{background:#fff8e8;border-right:4px solid #c9a85a;padding:10px;border-radius:10px}@media(max-width:560px){.composer{flex-direction:column}.composer .btn{width:100%}.chat{height:55vh}}</style></head><body><main class="wrap">
<section class="card" style="text-align:center"><img class="logo" src="/assets/rafig-logo.png?v=20260928" alt="RAFIQ | رفيق"><h1>🤖 مساعد رفيق</h1><p><b>نصل بالحب والأمان لرعاية العائلة</b></p><p class="status">مساعد استقبال للمنصة — لا يقدم تشخيصًا أو وصفًا دوائيًا.</p></section>
<section class="card"><div id="chat" class="chat" aria-live="polite"></div><div class="composer"><textarea id="input" maxlength="1500" placeholder="اكتب سؤالك هنا..."></textarea><button id="send" class="btn">إرسال</button></div><div class="actions"><button class="btn alt q">أريد مقدم رعاية</button><button class="btn alt q">أريد ممرض/ة</button><button class="btn alt q">أريد علاج فيزيائي</button><button class="btn alt q">أريد تقديم طلب</button></div><div id="status" class="status" style="margin-top:10px">المساعد يعمل مباشرة.</div></section>
<section class="card"><div class="err">للطلبات الحساسة أو العاجلة، تتم إحالتها إلى الإدارة للمراجعة.</div><div class="actions"><a class="btn" href="/app.html">تقديم طلب</a><a class="btn alt" href="/faq.html">الأسئلة الشائعة</a><a class="btn alt" href="https://wa.me/96181506299" target="_blank" rel="noopener">واتساب RAFIQ</a></div></section>
</main><script>
(function(){
const chat=document.getElementById('chat'),input=document.getElementById('input'),send=document.getElementById('send'),status=document.getElementById('status');
function add(t,c){const d=document.createElement('div');d.className='m '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function answer(t){
 const n=t.trim().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').toLowerCase();
 if(/(طارئ|عاجل|نزيف|لا يستطيع التنفس|اغماء|تشنج|سكتة)/.test(n)) return '🚨 إذا كانت الحالة طارئة، اتصل فورًا بالإسعاف 112 أو بأقرب مركز استشفاء. يمكن إرسال التفاصيل إلى إدارة رفيق للمراجعة.';
 if(/(دواء|جرعه|تشخيص|اوقف العلاج|تغيير العلاج)/.test(n)) return 'منصة رفيق لا تشخّص ولا تصف دواءً ولا تغيّر علاج الطبيب. يرجى الرجوع إلى الطبيب أو الفريق المعالج.';
 if(/(اسنان|تغذيه|نطق|مختبر|تحليل|تصوير|اشعه|معدات طبيه)/.test(n)) return 'انتظرونا قريبًا 🕐 — هذه الخدمة قيد الإضافة إلى منصة رفيق.';
 if(/(خدمات|ماذا تقدم|شو بتقدم|تقدمون)/.test(n)) return 'خدمات رفيق الأساسية:\n• رعاية كبار السن\n• رعاية المرضى\n• التمريض المنزلي\n• العلاج الفيزيائي المنزلي\n\nاخبرني ما الذي تحتاجه وسأوجهك إلى المسار المناسب.';
 if(/(مقدم رعايه|رعاية|مسن|كبير)/.test(n)) return 'مقدم الرعاية يساعد في الرعاية اليومية مثل النظافة واللباس والطعام والحركة والمرافقة. إذا كانت هناك إجراءات أو متابعة تمريضية، أخبرني بذلك.';
 if(/(ممرض|تمريض|حقن|قسطرة|جرح)/.test(n)) return 'التمريض المنزلي مخصص للمهام والإجراءات التمريضية وفق تعليمات الطبيب. اذكر المنطقة ونوع الحاجة وسنوجّه الطلب للمراجعة.';
 if(/(فيزيائي|علاج فيزيائي|تأهيل|تمارين|جلطه)/.test(n)) return 'العلاج الفيزيائي المنزلي يركز على إعادة التأهيل والتمارين الحركية بالتنسيق مع توصيات الفريق المعالج. اذكر المنطقة والحاجة.';
 if(/(سعر|تكلف|بكم|دفع|تحويل|whish)/.test(n)) return 'التفاصيل المالية لا يثبتها المساعد. يتم التعامل معها بعد مراجعة الإدارة.';
 if(/(مرحبا|السلام|اهلا|هلا|hello|hi)/.test(n)) return 'أهلًا بك في رفيق 👋 كيف أساعدك؟ رعاية منزلية، تمريض، علاج فيزيائي، أم تقديم طلب؟';
 if(/(طلب|تسجيل|انضم|عمل|وظيفه|مقدم خدمة)/.test(n)) return 'يمكنك تقديم الطلب مباشرة من صفحة التقديم. بعد الإرسال يبقى الطلب للمراجعة الإدارية قبل الاعتماد.';
 return 'أفهم سؤالك. أخبرني هل تحتاج رعاية منزلية، تمريضًا منزليًا، علاجًا فيزيائيًا، أم تريد تقديم طلب؟';
}
add('مرحبًا بك في رفيق 👋\nأنا مساعد رفيق. كيف أستطيع مساعدتك؟','a');
function go(){const v=input.value.trim();if(!v)return;add(v,'u');input.value='';send.disabled=true;status.textContent='جارٍ تجهيز الرد...';setTimeout(()=>{add(answer(v),'a');send.disabled=false;status.textContent='المساعد يعمل مباشرة.';input.focus()},120)}
send.onclick=go;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}});document.querySelectorAll('.q').forEach(b=>b.onclick=()=>{input.value=b.textContent;go()});
})();
</script><script src="/install-app.js?v=69" defer></script></body></html>
