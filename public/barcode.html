<style>

body{margin:0;background:#f4f8f6;color:var(--dark);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.8}

h2{color:var(--g);font-size:19px;margin:0 0 10px}
.center{text-align:center}
.small{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:12px;padding:12px 18px;background:var(--g);color:#fff;font-weight:800;cursor:pointer;text-decoration:none;min-height:46px}
.alt{background:#eaf2ef;color:var(--dark)}
.gold{background:var(--gold);color:var(--dark)}
.ok{background:var(--soft);border:1px solid #b9e4d1;border-radius:12px;padding:12px;margin:10px 0}
.err{background:#fff0f0;border:1px solid #efc2c5;color:#8b1e1e;border-radius:12px;padding:12px;margin:10px 0}
.notice{background:var(--cream);border-right:4px solid var(--gold);border-radius:12px;padding:12px;margin:10px 0;font-size:13px}
.tag{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:800;margin:3px}
.badge{background:var(--g);color:#fff;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800;display:inline-block}
.badge.warn{background:var(--gold);color:var(--dark)}
.badge.off{background:var(--muted);color:#fff}
.rows{margin:10px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row b{font-size:15px}
.money{font-size:17px;font-weight:900;color:var(--g);direction:ltr;unicode-bidi:plaintext}
input,select{width:100%;padding:12px;border:1px solid #cbdad3;border-radius:11px;font:inherit;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:14px}

.sect{margin:0 0 6px;font-weight:900;color:var(--g);font-size:15px}
@media(max-width:600px){h1{font-size:21px}}
</style>

<body>
<div class="wrap">

  <section class="card center">
    <img class="logo" src="./assets/rafig-logo.png?v=20260928" alt="RAFIQ | رفيق">
    <h1>باركود المنصة</h1>
    <p class="small">اعرف نوع خدمتك، وسعرك، وخصمك — مباشرة من باركودك</p>
  </section>

  <section class="card" id="scanCard">
    <h2>امسح الباركود</h2>
    <p class="small">وجّه الكاميرا نحو باركود المنصة، أو اكتب الرمز يدوياً.</p>
    <div style="margin:12px 0">
      <video id="video" playsinline muted style="width:100%;max-width:420px;border-radius:14px;background:#000;display:none"></video>
      <button class="btn alt" id="camBtn" type="button" style="width:100%;margin-bottom:10px">فتح الكاميرا</button>
      <label class="small">أو اكتب الرمز
        <input id="code" inputmode="text" autocapitalize="characters" placeholder="RAFIQ-XXXXXX">
      </label>
      <button class="btn" id="goBtn" type="button" style="width:100%;margin-top:10px">عرض البيانات</button>
    </div>
    <div id="msg"></div>
  </section>

  <section class="card hidden" id="result">
    <div class="center">
      <span class="badge" id="rBadge">—</span>
      <h2 id="rName" style="margin-top:8px">—</h2>
      <p class="small" id="rCode"></p>
    </div>
    <div class="rows" id="rRows"></div>
    <div class="notice" id="rNote"></div>
  </section>

  <section class="card center">
    <a class="btn alt" href="./">الصفحة الرئيسية</a>
    <a class="btn alt" href="https://wa.me/96181506299" target="_blank" rel="noopener">واتساب RAFIQ</a>
  </section>

  <p class="small center">RAFIQ | رفيق — نصل بالحب والأمان لرعاية العائلة</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const SUPABASE_URL='https://qmuxaehrahfsnabyjens.supabase.co',
      KEY='sb_publishable_AYoQSOTwTF1w3RT6CglKmA_WVcYUVlD',
      db=supabase.createClient(SUPABASE_URL,KEY),
      $=id=>document.getElementById(id);

const TYPE_AR={
  family:'أسرة / منتسب من العائلات',
  caregiver:'مقدم رعاية',
  nurse:'ممرض/ة',
  physiotherapist:'معالج فيزيائي',
  dentist:'طبيب/ة أسنان',
  nutritionist:'أخصائي/ة تغذية',
  speech_therapist:'أخصائي/ة نطق',
  other_medical:'مختص طبي آخر',
  owner:'صاحب مؤسسة'
};

function msg(t,ok){ $('msg').innerHTML = t ? '<div class="'+(ok?'ok':'err')+'">'+t+'</div>' : ''; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function row(k,v,cls){ return '<div class="row"><span class="small">'+esc(k)+'</span><span class="'+(cls||'b')+'">'+v+'</span></div>'; }

async function lookup(code){
  code=(code||'').trim().toUpperCase();
  if(!code){ msg('اكتب أو امسح رمز الباركود أولاً.'); return; }
  msg('جارٍ البحث…',true);

  // 1) member barcode
  const {data:mb,error:me}=await db.from('member_barcodes')
      .select('code,member_type,status').eq('code',code).maybeSingle();

  if(!me&&mb){
    if(mb.status!=='active'){
      msg('هذا الباركود غير مُفعّل بعد. يرجى مراجعة الإدارة.');
      return;
    }
    showMember(mb);
    return;
  }

  // 2) partner barcode
  const {data:pb,error:pe}=await db.from('partner_barcodes')
      .select('code,status,partner_id').eq('code',code).maybeSingle();

  if(!pe&&pb){
    if(pb.status!=='active'){ msg('باركود الجهة غير مُفعّل بعد.'); return; }
    showPartner(pb);
    return;
  }

  msg('لم يتم العثور على هذا الرمز. تأكد من المسح الصحيح.');
}

function showMember(m){
  $('scanCard').classList.add('hidden');
  $('result').classList.remove('hidden');
  $('rBadge').className='badge';
  $('rBadge').textContent = TYPE_AR[m.member_type] || 'عضو منصة';
  $('rName').textContent = 'أنت عضو معتمد في منصة RAFIQ';
  $('rCode').textContent = 'الرمز: '+m.code;

  $('rRows').innerHTML =
    row('حالة العضوية','<span class="badge">معتمد</span>') +
    row('نوع الخدمة', esc(TYPE_AR[m.member_type]||'—')) +
    row('طريقة الدفع','<span class="badge">Whish Money</span>') +
    row('الاشتراك','<span class="badge">مجاني</span>');

  $('rNote').innerHTML =
    '💡 <b>كيف تستفيد؟</b><br>'+
    'اعرض هذا الباركود في أي مختبر أو مركز أشعة أو محل معدات معتمد لدى RAFIQ '+
    'ليُسجَّل العمل المنجز وتُحتسب خصمك تلقائياً.<br><br>'+
    '⚠️ لا يمكن للوكيل إجراء أي عملية مالية. التحويل يتم عبر Whish Money فقط بعد مراجعة الإدارة.';
  window.scrollTo({top:0,behavior:'smooth'});
}

function showPartner(p){
  $('scanCard').classList.add('hidden');
  $('result').classList.remove('hidden');
  $('rBadge').className='badge';
  $('rBadge').textContent='جهة معتمدة';
  $('rName').textContent='جهة تعاقدية مع منصة RAFIQ';
  $('rCode').textContent='الرمز: '+p.code;
  $('rRows').innerHTML=row('الحالة','<span class="badge">معتمد</span>');
  $('rNote').innerHTML='طلب العمل أو الخدمة من هذه الجهة يُسجَّل في المنصة ويُحاسَب على نسبة الاتفاق المبرم.';
  window.scrollTo({top:0,behavior:'smooth'});
}

$('goBtn').onclick=()=>lookup($('code').value);
const urlCode=new URLSearchParams(location.search).get('code');
if(urlCode){ $('code').value=urlCode; lookup(urlCode); }
$('code').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); lookup($('code').value);} });

$('camBtn').onclick=()=>{
  if(window.Html5Qrcode){
    $('video').style.display='block';
    const scanner=new Html5Qrcode('video');
    scanner.start(
      {facingMode:'environment'},
      {fps:10,qrbox:{width:220,height:220}},
      (txt)=>{ scanner.stop().then(()=>{ $('video').style.display='none'; lookup(txt); }); },
      ()=>{}
    ).catch(()=>{ msg('تعذر فتح الكاميرا. اكتب الرمز يدوياً.'); });
  } else {
    msg('مكتبة الكاميرا لم تُحمّل. اكتب الرمز يدوياً.');
  }
};
</script>
<script>
/* RAFIQ logo guard: if the SVG fails to load, show a text wordmark instead. */
document.addEventListener("DOMContentLoaded",function(){
  document.querySelectorAll("img[src*='rafig-logo.png']").forEach(function(img){
    img.addEventListener("error",function(){
      var s=document.createElement("span");
      s.className="logo-fallback";
      s.textContent="RAFIQ | رفيق";
      if(getComputedStyle(img).display==="none"||img.naturalWidth===0){
        img.replaceWith(s);
      }
    });
  });
});
</script>
