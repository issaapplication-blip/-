<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>تسجيل مركز معدات طبية | RAFIQ</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f8f5;color:#17372d;font-family:Arial,Tahoma,sans-serif;line-height:1.8}main{max-width:900px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #dce9e2;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 24px rgba(20,70,50,.07)}h1,h2{color:#087f58}label{display:block;font-weight:800;margin:10px 0}input,textarea,select{width:100%;padding:11px;border:1px solid #cbdad3;border-radius:9px;font:inherit}textarea{min-height:100px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.btn{display:inline-block;border:0;border-radius:10px;padding:11px 16px;background:#087f58;color:#fff;text-decoration:none;font-weight:900;cursor:pointer}.alt{background:#eaf4ef;color:#17372d}.notice,.ok,.err{padding:12px;border-radius:10px;margin:10px 0}.notice{background:#fff8e8}.ok{background:#edf8f2}.err{background:#fff0f0;color:#8b1e1e}@media(max-width:620px){.grid{grid-template-columns:1fr}.btn{width:100%;text-align:center}}</style></head><body><main><nav class="card"><a class="btn alt" href="/app.html">المنصة</a><a class="btn alt" href="/admin.html">المدير</a><a class="btn alt" href="/telegram">Telegram</a><a class="btn alt" href="https://wa.me/96181506299">WhatsApp</a></nav><section class="card"><h1>تسجيل مركز معدات طبية</h1><p>نموذج مستقل لمراكز وشركات المعدات الطبية للبيع أو التأجير أو الدعم الفني.</p><div class="notice">التسجيل لا يعني اعتماد الشراكة أو وجود طلبات أو وعدًا بالتعامل. جميع الملفات تخضع لمراجعة إدارة RAFIQ.</div><form data-institution-form><input type="hidden" name="institution_type" value="medical_equipment_center"><div class="grid"><label>اسم الجهة*<input name="institution_name" required maxlength="250"></label><label>اسم المسؤول*<input name="contact_name" required maxlength="200"></label><label>الهاتف*<input name="phone" required maxlength="40" type="tel"></label><label>البريد الإلكتروني<input name="email" maxlength="250" type="email"></label><label>رقم الترخيص/السجل<input name="license_number" maxlength="160"></label><label>المحافظة<input name="governorate" maxlength="120"></label><label>القضاء<input name="district" maxlength="120"></label><label>المنطقة<input name="locality" maxlength="160"></label></div><label>العنوان<input name="address" maxlength="500"></label><label>الخدمات المقدمة<textarea name="services" maxlength="4000" placeholder="أنواع المعدات، البيع/التأجير، الصيانة، التوصيل، المناطق المخدومة…"></textarea></label><label>ملاحظات إضافية<textarea name="notes" maxlength="4000"></textarea></label><label>الملفات والوثائق<input name="files" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,.doc,.docx"></label><button class="btn" type="submit">إرسال طلب التسجيل للمراجعة</button></form><div id="formMsg" class="notice"></div></section></main><script src="/institution-form.js"></script></body></html>
