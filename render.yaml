services:
  - type: web
    name: RAFIQ
    runtime: node
    repo: https://github.com/issaapplication-blip/-
    plan: free
    envVars:
      - key: BUN_VERSION
        value: 1.3.0
      - key: RAFIQ_AGENT_MODEL
        value: gpt-5.6-luna
      - key: WHATSAPP_SENDING_ENABLED
        value: "false"
      - key: META_GRAPH_API_VERSION
        value: "v23.0"
    region: virginia
    buildCommand: bun install
    startCommand: bun start
version: "1"
